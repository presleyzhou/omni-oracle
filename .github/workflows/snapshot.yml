# Refreshes data/live.json once a day so the static site has a fallback for
# every public API it reads (and never hits BLS's 25-calls/day limit from browsers).
name: Data snapshot

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily, after most US releases land
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: daily snapshot $(date -u +%F)"
          git push

<section>
  <div class="container">
    <h1 class="section-title" data-i18n="mac.title"></h1>
    <p class="section-sub" data-i18n="mac.sub"></p>

    <div class="stats-bar" style="margin-bottom: 28px;">
      <div class="stat"><div class="num">2.3%</div><div class="lbl" data-i18n="mac.stat1"></div></div>
      <div class="stat"><div class="num">2.3%</div><div class="lbl" data-i18n="mac.stat2"></div></div>
      <div class="stat"><div class="num">2.5%</div><div class="lbl" data-i18n="mac.stat3"></div></div>
      <div class="stat"><div class="num down" id="recProb">23%</div><div class="lbl" data-i18n="mac.stat4"></div></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3 data-i18n="mac.gdp.title"></h3>
        <p style="margin-bottom:14px;" data-i18n="mac.gdp.desc"></p>
        <div class="chart-box"><canvas id="gdpChart"></canvas></div>
      </div>
      <div class="card">
        <h3 data-i18n="mac.cpi.title"></h3>

        <div class="chart-box"><canvas id="cpiChart"></canvas></div>
      </div>
      <div class="card">
        <h3 data-i18n="mac.news.title"></h3>
        <p style="margin-bottom:14px;" data-i18n="mac.news.desc"></p>
        <div class="chart-box"><canvas id="newsChart"></canvas></div>
      </div>
    </div>

    <div class="card hide" id="wbCard" style="margin-top:18px; border-color:rgba(34,197,94,0.35);">
      <h3 data-i18n="mac.wb.title"></h3>
      <p style="margin:6px 0 12px; font-size:0.82rem; color:var(--text-dim);" data-i18n="mac.wb.sub"></p>
      <div class="grid grid-2">
        <div class="chart-box short"><canvas id="wbGdpChart"></canvas></div>
        <div class="chart-box short"><canvas id="wbCpiChart"></canvas></div>
      </div>
    </div>

    <div class="card" style="margin-top:18px; border-color:rgba(139,92,246,0.35);">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <h3 data-i18n="ai.an.title"></h3>
        <button class="btn btn-primary" id="anRun" style="padding:7px 16px; font-size:0.83rem;" data-i18n="ai.an.run"></button>
      </div>
      <p style="margin:8px 0; font-size:0.85rem;" data-i18n="ai.an.macro"></p>
      <span id="anStatus" style="font-size:0.82rem; color:var(--text-dim);"></span>
      <div id="anOut" class="hide" style="margin-top:12px; padding:14px; border-radius:10px; background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.3); font-size:0.9rem; color:var(--text-dim); white-space:pre-wrap;"></div>

<script src="js/data.js?v=28"></script>

<script src="js/app.js?v=28"></script>
<script>
const M = OO.macro;
let charts = [];

function buildCharts() {
  charts.forEach(c => c.destroy());
  charts = [];

  document.getElementById("recProb").textContent = fmtPct(M.recessionProb12m);

  charts.push(new Chart(document.getElementById("gdpChart"), {
    type: "line",
    data: {
      labels: M.quarters,
      datasets: [
        { label: OO_T("ch.nowcast"), data: M.gdpNowcast, borderColor: OO_COLORS.accent, backgroundColor: OO_COLORS.accent, tension: 0.3 },
        { label: OO_T("ch.spf"), data: M.gdpSPF, borderColor: OO_COLORS.purple, backgroundColor: OO_COLORS.purple, borderDash: [6,4], tension: 0.3 },
        { label: OO_T("ch.tsfm"), data: M.gdpTSFM, borderColor: "#22d3ee", backgroundColor: "#22d3ee", borderDash: [2,3], tension: 0.3, pointRadius: 2 },
        { label: OO_T("ch.actual"), data: M.gdpActual, borderColor: OO_COLORS.green, backgroundColor: OO_COLORS.green, pointStyle: "rectRot", pointRadius: 5, showLine: false },
      ],
    },
    options: { maintainAspectRatio: false, scales: { y: { title: { display: true, text: "% SAAR" } } } },
  }));

  charts.push(new Chart(document.getElementById("cpiChart"), {
    type: "line",
    data: {
      labels: M.months,
      datasets: [
        { label: OO_T("ch.cpi"), data: M.cpiYoY, borderColor: OO_COLORS.amber, backgroundColor: OO_COLORS.amber, tension: 0.3 },
        { label: OO_T("ch.core"), data: M.coreYoY, borderColor: OO_COLORS.red, backgroundColor: OO_COLORS.red, tension: 0.3 },
      ],
    },
    options: { maintainAspectRatio: false, scales: { y: { title: { display: true, text: "% YoY" } } } },
  }));

  charts.push(new Chart(document.getElementById("newsChart"), {
    type: "bar",
    data: {
      labels: M.newsDecomp.map(d => d.release),
      datasets: [{
        label: OO_T("ch.newsLabel"),
        data: M.newsDecomp.map(d => d.impact),
        backgroundColor: M.newsDecomp.map(d => d.impact >= 0 ? "rgba(34,197,94,0.7)" : "rgba(239,68,68,0.7)"),
      }],
    },
    options: { maintainAspectRatio: false, indexAxis: "y", plugins: { legend: { display: false } } },
  }));

  const ensKeys = ["ens.dfm", "ens.rf", "ens.tsfm", "ens.bvar", "ens.crowd", "ens.mkt"];
  charts.push(new Chart(document.getElementById("ensembleChart"), {
    type: "bar",
    data: {
      labels: [OO_T("ch.ensLabel")],
      datasets: OO.macro.ensemble.map((e, i) => ({
        label: OO_T(ensKeys[i]),
        data: [e.weight],
        backgroundColor: [OO_COLORS.accent, OO_COLORS.purple, "#22d3ee", OO_COLORS.green, OO_COLORS.amber, OO_COLORS.red][i],
      })),
    },
    options: {
      maintainAspectRatio: false, indexAxis: "y",
      scales: { x: { stacked: true, max: 1, ticks: { callback: v => (100*v) + "%" } }, y: { stacked: true } },
    },
  }));
}

buildCharts();
document.addEventListener("oo:lang", buildCharts);

/* ---- World Bank actuals (open API, CORS-open, keyless) ---- */
const WB = { countries: { USA: "US", CHN: "CN", EUU: "EU", JPN: "JP" }, gdp: {}, cpi: {} };
let wbCharts = [];
function renderWb() {
  if (!Object.keys(WB.gdp).length) return;
  document.getElementById("wbCard").classList.remove("hide");
  wbCharts.forEach(c => c.destroy()); wbCharts = [];
  const years = ["2021", "2022", "2023", "2024", "2025"];
  const cols = [OO_COLORS.accent, OO_COLORS.purple, OO_COLORS.green, OO_COLORS.amber];
  const mk = (canvas, store, title) => wbCharts.push(new Chart(document.getElementById(canvas), {
    type: "line",
    data: {
      labels: years,
      datasets: Object.entries(WB.countries).map(([iso, lbl], i) => ({
        label: lbl, data: years.map(y => store[iso]?.[y] ?? null),
        borderColor: cols[i], backgroundColor: cols[i], tension: 0.3, spanGaps: true, pointRadius: 3,
      })),
    },
    options: { maintainAspectRatio: false, scales: { y: { title: { display: true, text: title } } } },
  }));
  mk("wbGdpChart", WB.gdp, OO_T("mac.wb.gdp"));
  mk("wbCpiChart", WB.cpi, OO_T("mac.wb.cpi"));
}
Promise.all(Object.keys(WB.countries).flatMap(iso => [
  ["NY.GDP.MKTP.KD.ZG", "gdp"], ["FP.CPI.TOTL.ZG", "cpi"],
].map(([ind, slot]) =>
  fetch(`https://api.worldbank.org/v2/country/${iso}/indicator/${ind}?format=json&per_page=8&date=2021:2025`)
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(d => {
      if (!Array.isArray(d) || !d[1]) return;
      WB[slot][iso] = {};
      d[1].forEach(r => { if (r.value != null) WB[slot][iso][r.date] = +r.value.toFixed(2); });
    })
))).then(renderWb);
document.addEventListener("oo:lang", renderWb);

/* ---- AI macro analyst ---- */
ooAnalyst("anRun", "anOut", "anStatus", () => {
  const wbTxt = Object.entries(WB.gdp).map(([iso, v]) =>
    `${WB.countries[iso]} GDP ${Object.entries(v).map(([y, x]) => y + ":" + x).join(",")}`).join(" | ");
  return {
    system: "You are the macro analyst of Omni Oracle. Write a concise, decision-oriented read (150-200 words): what the nowcast and inflation path imply, where model and market disagree, one thing to watch, one risk. No preamble, no markdown headers. Reply strictly in this language code: " + OO_LANG + ".",
    user: `Nowcast GDP 2026Q2: ${M.gdpNowcast.at(-1)}% SAAR (SPF ${M.gdpSPF.at(-1)}%, TSFM ${M.gdpTSFM.at(-1)}%). ` +
      `CPI YoY latest ${M.cpiYoY.at(-1)}%, core ${M.coreYoY.at(-1)}%, 12m path ${M.cpiYoY.join(",")}. ` +
      `Recession probability ${Math.round(M.recessionProb12m * 100)}%. ` +
      `Ensemble weights: ${M.ensemble.map(e => e.source + " " + Math.round(e.weight * 100) + "%").join(", ")}. ` +
      `Nowcast news decomposition: ${M.newsDecomp.map(n => n.release + " " + n.impact).join("; ")}. ` +
      `World Bank actuals: ${wbTxt || "(loading)"}.`,
  };
});
</script>
